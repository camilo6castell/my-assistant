[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True

# Configuración de paquetes
explicit_package_bases = True
namespace_packages = True
mypy_path = .

exclude = .venv

; Ignorar errores de importación para paquetes sin tipos, mala práctica.
; ignore_missing_imports = True

# Configurar librerías sin tipos (untyped)
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-numpy]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-sentence_transformers]
ignore_missing_imports = True

[mypy-faiss.*]
ignore_missing_imports = True

[mypy-faiss]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-openai]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-beautifulsoup4.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-readability.*]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True